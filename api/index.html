<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyber Threat Screening Demo</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px;background:#0b1020;color:#eef2ff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,button{padding:12px;border-radius:8px;border:1px solid #334155}input{background:#111827;color:white}button{background:#2563eb;color:white;cursor:pointer}.card{padding:20px;border:1px solid #334155;border-radius:14px;margin-top:20px}</style></head><body><h1>AI Cyber Threat Screening</h1><p>Interactive API demo. Hosted fallback mode is explainable and is not the reported research model.</p><div class="grid" id="form"></div><button onclick="predict()">Analyze Flow</button><div class="card" id="out">Enter network-flow features and analyze.</div><script>
const fields=["duration","total_fwd_packets","total_backward_packets","total_length_fwd_packets","total_length_bwd_packets","flow_bytes_per_second","flow_packets_per_second","syn_flag_count","rst_flag_count","packet_length_mean"];
form.innerHTML=fields.map(function(f){return "<label>"+f+"<input id='"+f+"' type='number' step='any' value='0'></label>"}).join("");
async function predict(){const body=Object.fromEntries(fields.map(function(f){return [f,Number(document.getElementById(f).value)]}));const r=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const x=await r.json();out.innerHTML="<h2>"+x.prediction+"</h2><p>Risk score: <b>"+x.risk_score+"</b></p><p>"+(x.reasons.join(", ")||"No strong heuristic indicators.")+"</p><small>"+x.note+"</small>"}
</script></body></html>
